name: Sync content from Supabase

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      preview:
        description: 'Ignore approval gates (unapproved records are published)'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # The nightly run publishes only approved, publicly-visible records.
      # Preview (approval gates ignored, site noindexed) is opt-in, and only
      # via workflow_dispatch — the cron run sends no inputs at all, so the
      # comparison must be against 'true', not away from 'false'.
      - name: Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PREVIEW: ${{ github.event.inputs.preview == 'true' }}
        run: |
          if [ "$PREVIEW" = 'true' ]; then
            uv run --project scripts scripts/sync.py --preview
          else
            uv run --project scripts scripts/sync.py
          fi

      - name: Commit if changed
        run: |
          # _meta.json carries generated_at, which moves on every run. Judging by it
          # would commit and redeploy nightly even when no content changed, so decide
          # on the entity files alone and put _meta.json back when they are unchanged.
          # generated_at then reads as "content last changed", which is what the
          # footer colophon should say anyway.
          if [ -z "$(git status --porcelain -- data/generated ':(exclude)data/generated/_meta.json')" ]; then
            git checkout -- data/generated/_meta.json
            echo 'No content changes.'
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/generated
          git commit -m 'Sync content from Supabase'
          git push
