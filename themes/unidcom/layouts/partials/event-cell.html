{{- $event := .event -}}
<article class="cell event-cell">
  <a href="{{ $event.RelPermalink }}">
    <p class="eyebrow{{ if .upcoming }} status--live{{ end }}">{{ if .upcoming }}Upcoming{{ else }}Past event{{ end }}</p>
    <p class="meta"><time datetime="{{ $event.Date.Format "2006-01-02" }}">{{ $event.Date.Format "2 January 2006" }}</time>{{ with $event.Params.event_type }} · {{ . }}{{ end }}</p>
    <h3 class="cell-title">{{ $event.Title }}</h3>
    {{ with $event.Params.summary }}<p class="cell-summary">{{ . }}</p>{{ end }}
  </a>
</article>
