{{/* Subpages for the nav items: sticky nav, red hero strip with the title,
     prose body. The full band artwork stays home-only. */}}
{{ define "main" }}
  {{ partial "top-nav.html" . }}
  <header class="page-hero">
    <div class="container"><h1>{{ .Title }}</h1></div>
  </header>
  <main class="page-main">
    <div class="container prose">{{ .Content }}</div>
  </main>
  {{ partial "site-footer.html" . }}
{{ end }}
