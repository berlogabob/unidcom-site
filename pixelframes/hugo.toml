# Second Hugo site: the PixelFrames conference landing page, on its own domain.
# The main site is a GitHub Pages project site and Pages allows one custom domain
# per repo, so the conference domain needs its own build. Reuses the vendored
# unidcom theme via themesDir so there is no duplicated CSS, fonts, or logo.
#
# Build:  hugo --source pixelframes --minify --gc
# Deploy: FTP_PASS='...' ./scripts/deploy_pixelframes.sh

baseURL = "https://pixelframe2027.unidcom-iade.pt/"
locale = "en-gb"
title = "PixelFrame 2027"
theme = "unidcom"
themesDir = "../themes"
enableRobotsTXT = true

# One page, no tags — don't emit empty /categories/ and /tags/ listings.
disableKinds = ["taxonomy", "term"]

[params]
  description = "PixelFrame — International Conference in Animation, Videogames and Visual Narratives. Lisbon, 5-6 May 2027."

[markup.goldmark.renderer]
  unsafe = true
